name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./paket.sh
      - name: Release mit Paket und Prüfsumme anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/web-dupplet.tar.gz dist/web-dupplet.tar.gz.sha256 --title "$GITHUB_REF_NAME" --generate-notes
