name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Hilfsprogramme (ffmpeg für Video/Audio, poppler-utils für PDF)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg poppler-utils
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Paket bauen
        run: ./paket.sh
